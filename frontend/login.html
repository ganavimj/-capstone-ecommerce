<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Capstone Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-nav"></header>
  <main class="container">
    <div class="panel auth-card">
      <h1>Log in</h1>
      <p class="subtitle">Demo admin: <code>admin@demo.com</code> / <code>Admin123!</code></p>
      <form id="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width:100%">Log in</button>
        <p id="form-error" class="error-text"></p>
      </form>
      <p class="muted">No account? <a href="register.html">Register</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
