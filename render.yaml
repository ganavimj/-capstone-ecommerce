# Render blueprint: PostgreSQL database + backend API.
databases:
  - name: capstone-ecommerce-db
    plan: free

services:
  - type: web
    name: capstone-ecommerce-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-ecommerce-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_NAME
        value: Site Admin
      - key: ADMIN_EMAIL
        value: admin@demo.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

# After the first deploy, run the seed once from the Render shell:
#   npm run seed
